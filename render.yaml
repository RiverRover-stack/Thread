# Private rollout first; public access is enabled only after verification.
# Local development keeps its existing database; this defines a separate Render DB.
services:
  - type: web
    name: thread
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    # Free services have no pre-deploy hook. Stop startup if migrations fail.
    startCommand: npm run db:migrate && npm start -- --hostname 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: THREAD_ACCESS_PASSWORD
        generateValue: true
      - key: THREAD_ACCESS_MODE
        value: private
      - key: THREAD_SESSION_SECRET
        generateValue: true
      - key: THREAD_PUBLIC_AI_ENABLED
        value: "false"
      - key: THREAD_QUOTA_TIMEZONE
        # Display only: both UTC and IST allowances are always enforced.
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: thread-production-db
          property: connectionString
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: google
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: EMBEDDING_PROVIDER
        value: google
      - key: RELATED_THOUGHTS_MIN_SIMILARITY
        # Preliminary hosted-model threshold from synthetic ranking; evaluate real cases.
        value: "0.80"

databases:
  - name: thread-production-db
    databaseName: thread_production
    plan: free
    # Block public database connections; the web service uses Render's internal URL.
    ipAllowList: []
    # Free Render Postgres expires after 30 days. Choose a paid plan for ongoing use.
